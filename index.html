<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Form Card Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- The single background card that slides and spins -->
        <div class="sliding-bg-card"></div>

        <!-- LOGIN FORM (Left Side) -->
        <div class="form-box login-box">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <input type="text" required>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="regi-link">
                    <p>Don't have an account? <a href="#" class="SignUpLink">Register</a></p>
                </div>
            </form>
        </div>

        <!-- REGISTRATION FORM (Right Side) -->
        <div class="form-box register-box">
            <h2>Register</h2>
            <form action="#">
                <div class="input-box">
                    <input type="text" required>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn">Register</button>
                <div class="regi-link">
                    <p>Already have an account? <a href="#" class="SignInLink">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        const container = document.querySelector(".container");
        const signUpLink = document.querySelector(".SignUpLink");
        const signInLink = document.querySelector(".SignInLink");

        signUpLink.addEventListener("click", (e) => {
            e.preventDefault();
            container.classList.add("active");
        });

        signInLink.addEventListener("click", (e) => {
            e.preventDefault();
            container.classList.remove("active");
        });
    </script>
</body>
</html>
